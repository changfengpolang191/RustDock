[package]
name = "rustdock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustdock"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "winbase",
    "libloaderapi",
    "shellapi",
    "winreg",
    "winnt",
    "processthreadsapi",
    "handleapi",
    "minwindef",
    "windef",
] }
# png-format 是 Pixmap::load_png 的前提，默认开着，这里显式指定防止被全局关掉
tiny-skia = { version = "0.11", features = ["png-format", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# debug 构建也去掉调试信息，构建产物小、链接快
[profile.dev]
debug = false
